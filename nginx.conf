user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 将 $http_upgrade 变量映射到 $connection_upgrade 变量
    # 根据客户端是否支持 WebSocket 设置 Connection 字段
    map $http_upgrade $connection_upgrade {
         default upgrade;
         ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # dev环境
    server {
        listen  80;
        server_name  localhost;

        location / {
            root  /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /prod-api/ {
            #nginx的主机地址
            proxy_pass http://ruoyi-admin:8080/;
            proxy_set_header Host $http_host;

            #用户端真实的IP，即客户端IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /ws/ {
            proxy_pass http://ruoyi-admin:8080/;
            # 表示使用 HTTP/1.1 协议
            proxy_http_version 1.1;
            # 表示将 Upgrade 头设置为 $http_upgrade。在http请求头中加入了 Upgrade: websocket
            proxy_set_header Upgrade $http_upgrade;
            # 表示将 Connection 头设置为 "upgrade"。在http请求头中加入了 Connection: Upgrade
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
