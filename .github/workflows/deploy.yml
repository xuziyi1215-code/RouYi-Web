name: Deploy RouYi-Web

on:
  push:
    branches:
      - master-1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------------
    # Step 1：拉取代码
    # ------------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@v3

    # ------------------------------------------------------------
    # Step 2：配置 Node 环境（与 Dockerfile 一致）
    # ------------------------------------------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.20.1'

    # ------------------------------------------------------------
    # Step 3：安装依赖 & 打包
    # ------------------------------------------------------------
    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build project
      run: pnpm run build:prod

    # ------------------------------------------------------------
    # Step 4：构建 docker 镜像
    # ------------------------------------------------------------
    - name: Build docker image
      run: docker build -t ruoyi-web:latest .

    # ------------------------------------------------------------
    # Step 5：保存为 tar.gz 上传到服务器
    # ------------------------------------------------------------
    - name: Save docker image
      run: docker save ruoyi-web:latest | gzip > ruoyi-web.tar.gz

    # ------------------------------------------------------------
    # Step 6：上传到服务器（你指定的 target）
    # ------------------------------------------------------------
    - name: Upload Image
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "ruoyi-web.tar.gz"
        target: "/data/docker/ruoyi-web"

    # ------------------------------------------------------------
    # Step 7：SSH 部署到服务器
    # ------------------------------------------------------------
    - name: Deploy on Server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "进入 RouYi-Web 目录..."
          cd /data/docker/ruoyi-web

          echo "解压镜像包..."
          gunzip -f ruoyi-web.tar.gz

          echo "加载镜像..."
          docker load < ruoyi-web.tar

          echo "重启 docker compose 服务 RouYi-Web..."
          cd /data/docker
          
          docker compose up -d ruoyi-web

          echo "🎉 RouYi-Web 前端部署成功！"
